<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest Account | Palm Paradise</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="palm.css"></head><body><nav class="navbar navbar-light"><a class="navbar-brand" href="index.html"><span class="brand-mark">♒</span>Palm Paradise <small>RESORT</small></a><a class="nav-link" href="index.html">Back home</a></nav><header class="page-hero"><div class="eyebrow">Your Palm Paradise</div><h1>Welcome back.</h1><p>Save your details and keep every future escape close at hand.</p></header><main class="page-content"><div class="row justify-content-center"><div class="col-lg-6"><div class="panel"><div class="btn-group mb-4" role="group"><button class="btn btn-palm" id="loginTab">Login</button><button class="btn btn-outline-secondary" id="signupTab">Create account</button></div><form id="accountForm"><div class="form-group"><label for="email">Email address</label><input class="form-control" id="email" type="email" required></div><div class="form-group"><label for="password">Password</label><input class="form-control" id="password" type="password" required></div><div class="form-group d-none" id="nameGroup"><label for="fullName">Full name</label><input class="form-control" id="fullName"></div><button class="btn btn-palm" type="submit" id="accountSubmit">Login to your account</button><p id="accountMessage" class="mt-3 mb-0" role="status"></p></form></div></div></div></main><script>let signup=false;const nameGroup=document.getElementById('nameGroup'),submit=document.getElementById('accountSubmit');document.getElementById('signupTab').onclick=()=>{signup=true;nameGroup.classList.remove('d-none');submit.textContent='Create my account';};document.getElementById('loginTab').onclick=()=>{signup=false;nameGroup.classList.add('d-none');submit.textContent='Login to your account';};document.getElementById('accountForm').onsubmit=e=>{e.preventDefault();document.getElementById('accountMessage').textContent=signup?'Account created. Welcome to Palm Paradise.':'You are logged in. Welcome back.';document.getElementById('accountMessage').style.color='#2e7160';};</script></body></html>
