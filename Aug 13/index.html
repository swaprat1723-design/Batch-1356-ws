<!DOCTYPE html>
<html lang="en">

<head>

    <title>Kiran Academy - Job Portal</title>
</head>

<body>
    <Center> <h1> User Registration for Job Portal</h1><hr>

    <table>

    <form action="#Sai-Baba">

        <tr>
            
            <td>Username:</td>
            <td><input type="text" name="username" Placeholder="Enter your name" required><br><br></td>

        </tr>


        <tr>    
            <td>Address:</td>

            <td><textarea name="address" id="" rows="4" cols="28" Placeholder="Enter your address" required></textarea><br><br>    </td>

        </tr>

        <tr>    

            <td>Gender:</td>
            <td><input type="radio" name="gender" id="" value="male"> Male
                <input type="radio" name="gender" id="" value="female"> Female  
                <input type="radio" name="gender" id="" value="other" checked> Other<br><br> </td>
        </tr>

        <tr>    

            <td>Skills:</td>
            <td>HTML: <input type="checkbox" name="html" id="" value="html"checked> 
                Python: <input type="checkbox" name="python" id="" value="python" > 
                DA: <input type="checkbox" name="DA" id="" value="Data Analytics">
                DS: <input type="checkbox" name="DS" id="" value="Data Science"> <br><br></td>

        </tr>

        <tr>

            <td>Country:</td>
            <td><select name="country" id="">
            <option value="India" selected>India</option> 
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Canada">Canada</option>
        </select><br><br>

        </tr>
        
        <tr>
            <td colspan="2" align="center"><button type="submit" style="width: 100%;">Register</button></td>

        </tr>

    </form>

    </table>

    </Center>

</body>

</html>
